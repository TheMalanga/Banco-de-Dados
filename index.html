<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de empresa</h1>

        <form id="formulario">

            <label>
                Nome da empresa
            </label>

            <input
                type="text"
                id="empresa"
                required
            >

            <label>
                Setor
            </label>

            <input
                type="text"
                id="setor"
                required
            >

            <label>
                Faturamento
            </label>

            <input
                type="number"
                id="faturamento"
                required
            >

            <label>
                Funcionários
            </label>

            <input
                type="number"
                id="funcionarios"
                required
            >

            <button type="submit">
                Enviar
            </button>

        </form>

        <p id="mensagem"></p>

        <a href="dashboard.html">
            Ir para o Dashboard
        </a>

    </div>

    <script src="app.js"></script>

</body>

</html>
